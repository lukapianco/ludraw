# LuDraw — PostgreSQL só para desenvolvimento e testes do servidor (Chat 07).
# O docker-compose completo (servidor + cliente + banco) é do Chat 09.
#   docker compose -f server/docker-compose.dev.yml up -d
#   DATABASE_URL=postgres://ludraw:ludraw@localhost:5433/ludraw
name: ludraw-dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ludraw
      POSTGRES_PASSWORD: ludraw
      POSTGRES_DB: ludraw
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ludraw-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ludraw"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  ludraw-dev-db:
