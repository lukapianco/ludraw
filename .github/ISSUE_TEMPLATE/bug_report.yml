name: Relatar um problema
description: Algo não funciona como deveria no LuDraw.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar! Antes de enviar, confira se já existe uma issue igual.
        **Não anexe boards com dados pessoais ou confidenciais.** Para falhas de segurança, use o SECURITY.md.
  - type: textarea
    id: oque
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Abra um board novo
        2. Crie um post-it
        3. ...
    validations:
      required: true
  - type: input
    id: funcao
    attributes:
      label: Função envolvida (opcional)
      description: "ID do catálogo em docs/FEATURES.md, se souber (ex.: FT-EXPORTAR-004)."
  - type: dropdown
    id: ambiente
    attributes:
      label: Onde você usa
      options:
        - Navegador (npm run dev / build)
        - Homelab (Docker)
        - Aplicativo desktop
        - Outro
    validations:
      required: true
  - type: input
    id: navegador
    attributes:
      label: Navegador e sistema operacional
      placeholder: "Ex.: Chrome 131 no Windows 11"
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão ou commit do LuDraw
      placeholder: "Ex.: 0.5.0 ou hash do commit"
  - type: textarea
    id: extras
    attributes:
      label: Capturas de tela, mensagens do console ou arquivo .ludraw de exemplo
      description: "Opcional. Use só conteúdo de teste."
